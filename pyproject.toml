[project]
name = "krea-runpod-worker"
version = "0.1.0"
description = "RunPod Serverless worker for Krea 2 Turbo with dynamic LoRA selection"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
